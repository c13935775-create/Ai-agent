<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0d0d23">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json">
  <title>Mera AI Agent</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0d0d23;
      --surface: #14142e;
      --card: #1e1e40;
      --accent: #7c3aed;
      --accent-light: #a78bfa;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --user-bubble: #6d28d9;
      --ai-bubble: #1a1a3a;
      --green: #22c55e;
      --red: #ef4444;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ===== HEADER ===== */
    header {
      background: var(--surface);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(124,58,237,0.25);
      flex-shrink: 0;
    }

    .agent-info { display: flex; align-items: center; gap: 12px; }

    .avatar {
      width: 42px; height: 42px;
      border-radius: 50%;
      background: conic-gradient(#7c3aed, #2563eb, #06b6d4, #10b981, #7c3aed);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 16px; color: white;
      animation: colorSpin 6s linear infinite;
      flex-shrink: 0;
    }

    @keyframes colorSpin {
      to { filter: hue-rotate(360deg); }
    }

    .agent-name { font-size: 16px; font-weight: 600; }
    .agent-status { font-size: 12px; color: var(--green); margin-top: 1px; }

    .header-btns { display: flex; gap: 8px; }

    .icon-btn {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      color: var(--muted);
      font-size: 17px;
      padding: 6px 10px;
      cursor: pointer;
    }

    /* ===== CHAT AREA ===== */
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 16px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      scroll-behavior: smooth;
    }

    #chat::-webkit-scrollbar { width: 3px; }
    #chat::-webkit-scrollbar-thumb { background: rgba(124,58,237,0.3); border-radius: 4px; }

    /* Welcome screen */
    .welcome {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; padding: 30px 20px; gap: 12px;
      color: var(--muted);
    }

    .welcome .big-circle {
      width: 90px; height: 90px; border-radius: 50%;
      background: conic-gradient(#7c3aed, #2563eb, #06b6d4, #10b981, #7c3aed);
      display: flex; align-items: center; justify-content: center;
      font-size: 36px; margin-bottom: 8px;
      animation: colorSpin 4s linear infinite;
    }

    .welcome h2 { color: var(--text); font-size: 18px; }

    .suggestion-chips {
      display: flex; flex-wrap: wrap; justify-content: center; gap: 8px;
      margin-top: 12px;
    }

    .chip {
      background: var(--card); border: 1px solid rgba(124,58,237,0.3);
      border-radius: 20px; padding: 8px 14px; font-size: 13px;
      color: var(--accent-light); cursor: pointer;
    }

    /* Message bubbles */
    .msg {
      max-width: 82%;
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 15px;
      line-height: 1.55;
      word-break: break-word;
      animation: popIn 0.2s ease;
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.92); }
      to { opacity: 1; transform: scale(1); }
    }

    .msg.user {
      background: var(--user-bubble);
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }

    .msg.ai {
      background: var(--ai-bubble);
      border: 1px solid rgba(124,58,237,0.2);
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }

    .msg.typing { color: var(--muted); font-style: italic; }

    /* ===== INPUT AREA ===== */
    .input-bar {
      background: var(--surface);
      border-top: 1px solid rgba(124,58,237,0.2);
      padding: 10px 12px;
      display: flex; gap: 8px; align-items: flex-end;
      flex-shrink: 0;
    }

    #user-input {
      flex: 1;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(124,58,237,0.3);
      border-radius: 22px;
      padding: 10px 16px;
      color: var(--text);
      font-size: 15px;
      font-family: inherit;
      resize: none; outline: none;
      min-height: 44px; max-height: 120px;
      line-height: 1.5;
    }

    #user-input::placeholder { color: var(--muted); }
    #user-input:focus { border-color: rgba(124,58,237,0.6); }

    .round-btn {
      width: 44px; height: 44px;
      border-radius: 50%; border: none;
      cursor: pointer; font-size: 18px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: transform 0.1s, background 0.2s;
    }

    .round-btn:active { transform: scale(0.9); }

    #mic-btn {
      background: rgba(124,58,237,0.15);
      color: var(--accent-light);
      border: 1px solid rgba(124,58,237,0.35);
    }

    #mic-btn.on {
      background: rgba(239,68,68,0.15);
      color: var(--red);
      border-color: rgba(239,68,68,0.4);
      animation: pulse 1s ease infinite;
    }

    @keyframes pulse { 50% { transform: scale(1.12); } }

    #send-btn { background: var(--accent); color: white; }

    /* ===== SETTINGS MODAL ===== */
    .overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.75); z-index: 200;
      align-items: flex-end;
    }

    .overlay.open { display: flex; }

    .modal {
      background: #16163a;
      width: 100%;
      border-radius: 24px 24px 0 0;
      padding: 20px 18px 30px;
      border: 1px solid rgba(124,58,237,0.3);
      border-bottom: none;
      max-height: 85dvh;
      overflow-y: auto;
    }

    .modal-handle {
      width: 36px; height: 4px;
      background: rgba(255,255,255,0.15);
      border-radius: 2px; margin: 0 auto 18px;
    }

    .modal h3 {
      color: var(--accent-light); font-size: 17px; margin-bottom: 16px;
    }

    .field { margin-bottom: 14px; }

    .field label {
      display: block; font-size: 11px;
      color: var(--muted); margin-bottom: 6px;
      text-transform: uppercase; letter-spacing: 0.06em;
    }

    .field input, .field textarea, .field select {
      width: 100%;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(124,58,237,0.3);
      border-radius: 12px;
      padding: 11px 13px;
      color: var(--text); font-size: 14px;
      font-family: inherit; outline: none;
    }

    .field textarea { resize: none; line-height: 1.5; }
    .field input:focus, .field textarea:focus { border-color: rgba(124,58,237,0.6); }

    .api-hint {
      font-size: 12px; color: var(--accent-light);
      margin-top: 5px; display: block;
    }

    .save-btn {
      width: 100%; background: var(--accent);
      color: white; border: none;
      border-radius: 14px; padding: 14px;
      font-size: 16px; font-weight: 600;
      cursor: pointer; margin-top: 8px;
    }

    .clear-btn {
      width: 100%; background: rgba(239,68,68,0.1);
      color: var(--red); border: 1px solid rgba(239,68,68,0.3);
      border-radius: 14px; padding: 11px;
      font-size: 14px; cursor: pointer; margin-top: 8px;
    }
  </style>
</head>
<body>

<!-- ===== HEADER ===== -->
<header>
  <div class="agent-info">
    <div class="avatar" id="avatar">A</div>
    <div>
      <div class="agent-name" id="header-name">Mera AI Agent</div>
      <div class="agent-status" id="status-dot">● Online</div>
    </div>
  </div>
  <div class="header-btns">
    <button class="icon-btn" onclick="openSettings()">⚙️</button>
  </div>
</header>

<!-- ===== CHAT ===== -->
<div id="chat">
  <div class="welcome" id="welcome">
    <div class="big-circle">🤖</div>
    <h2 id="welcome-title">Namaste! Main tumhara AI Agent hoon</h2>
    <p>Settings (⚙️) mein API key daalo, phir kuch bhi poochho.</p>
    <div class="suggestion-chips">
      <div class="chip" onclick="quickSend('Website banane mein help karo')">🌐 Website banao</div>
      <div class="chip" onclick="quickSend('Ek business plan likho mere liye')">📋 Business plan</div>
      <div class="chip" onclick="quickSend('Aaj ka motivational quote do Hindi mein')">✨ Motivation</div>
      <div class="chip" onclick="quickSend('Code likhne mein help karo')">💻 Code help</div>
    </div>
  </div>
</div>

<!-- ===== INPUT BAR ===== -->
<div class="input-bar">
  <button class="round-btn" id="mic-btn" onclick="toggleVoice()">🎤</button>
  <textarea id="user-input" placeholder="Kuch bhi poochho..."
            rows="1" onkeydown="handleKey(event)" oninput="resize(this)"></textarea>
  <button class="round-btn" id="send-btn" onclick="sendMessage()">➤</button>
</div>

<!-- ===== SETTINGS MODAL ===== -->
<div class="overlay" id="settings-modal" onclick="bgClose(event)">
  <div class="modal">
    <div class="modal-handle"></div>
    <h3>⚙️ Settings</h3>

    <div class="field">
      <label>Agent ka naam</label>
      <input type="text" id="s-name" placeholder="Mera AI Agent">
    </div>

    <div class="field">
      <label>Gemini API Key (FREE hai!)</label>
      <input type="password" id="s-key" placeholder="AIza...">
      <a class="api-hint" href="https://aistudio.google.com/apikey" target="_blank">
        👆 Yahan se free API key lo (Google account chahiye)
      </a>
    </div>

    <div class="field">
      <label>Agent ki personality</label>
      <textarea id="s-prompt" rows="3"
        placeholder="Tum ek helpful AI agent ho..."></textarea>
    </div>

    <button class="save-btn" onclick="saveSettings()">✓ Save Karo</button>
    <button class="clear-btn" onclick="clearChat()">🗑️ Chat Clear Karo</button>
  </div>
</div>

<script>
// ===== DATA =====
let history = JSON.parse(localStorage.getItem('chat_v1') || '[]');
let cfg = JSON.parse(localStorage.getItem('cfg_v1') || '{}');
let listening = false, recog = null;

// ===== BOOT =====
(function init() {
  // Apply saved settings
  if (cfg.name) {
    document.getElementById('header-name').textContent = cfg.name;
    document.getElementById('welcome-title').textContent = `Namaste! Main ${cfg.name} hoon`;
    document.getElementById('avatar').textContent = cfg.name[0].toUpperCase();
  }
  if (cfg.name) document.getElementById('s-name').value = cfg.name;
  if (cfg.key)  document.getElementById('s-key').value  = cfg.key;
  if (cfg.prompt) document.getElementById('s-prompt').value = cfg.prompt;

  // Render old messages
  history.forEach(m => bubble(m.r, m.t, false));
  if (history.length) document.getElementById('welcome').style.display = 'none';

  // Voice setup
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (SR) {
    recog = new SR();
    recog.lang = 'hi-IN';
    recog.onresult = e => {
      document.getElementById('user-input').value = e.results[0][0].transcript;
      voiceOff(); sendMessage();
    };
    recog.onend = voiceOff;
    recog.onerror = voiceOff;
  }

  // Service Worker
  if ('serviceWorker' in navigator)
    navigator.serviceWorker.register('sw.js').catch(() => {});
})();

// ===== SEND MESSAGE =====
async function sendMessage() {
  const inp = document.getElementById('user-input');
  const text = inp.value.trim();
  if (!text) return;

  if (!cfg.key) {
    openSettings();
    alert('Pehle Gemini API key daalo ⚙️');
    return;
  }

  inp.value = ''; resize(inp);
  document.getElementById('welcome').style.display = 'none';

  bubble('user', text, true);

  const tid = 'typing-' + Date.now();
  const tb = bubble('ai', '⋯ Soch raha hoon...', false, tid, true);

  try {
    const reply = await gemini(text);
    document.getElementById(tid)?.remove();
    bubble('ai', reply, true);
  } catch (err) {
    document.getElementById(tid)?.remove();
    bubble('ai', '❌ Error: ' + err.message, false);
  }
}

// ===== GEMINI API CALL =====
async function gemini(userMsg) {
  const sys = cfg.prompt || 'Tum ek helpful AI agent ho. Hindi aur English dono mein jawab de sakte ho.';

  // Build history for context (last 12 msgs)
  const msgs = history.slice(-12).map(m => ({
    role: m.r === 'user' ? 'user' : 'model',
    parts: [{ text: m.t }]
  }));
  msgs.push({ role: 'user', parts: [{ text: userMsg }] });

  const res = await fetch(
    `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${cfg.key}`,
    {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        system_instruction: { parts: [{ text: sys }] },
        contents: msgs,
        generationConfig: { maxOutputTokens: 1500, temperature: 0.75 }
      })
    }
  );

  if (!res.ok) {
    const e = await res.json().catch(() => ({}));
    throw new Error(e.error?.message || `HTTP ${res.status}`);
  }

  const d = await res.json();
  return d.candidates?.[0]?.content?.parts?.[0]?.text?.trim() || 'Koi jawab nahi mila.';
}

// ===== BUBBLE HELPER =====
function bubble(role, text, save, id, typing) {
  const chat = document.getElementById('chat');
  const d = document.createElement('div');
  d.id = id || ('m' + Date.now());
  d.className = 'msg ' + role + (typing ? ' typing' : '');
  d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;

  if (save) {
    history.push({ r: role, t: text });
    if (history.length > 60) history = history.slice(-60);
    localStorage.setItem('chat_v1', JSON.stringify(history));
  }
  return d;
}

// ===== QUICK SUGGESTIONS =====
function quickSend(text) {
  document.getElementById('user-input').value = text;
  sendMessage();
}

// ===== VOICE =====
function toggleVoice() { listening ? voiceOff() : voiceOn(); }

function voiceOn() {
  if (!recog) return alert('Voice aapke browser mein support nahi hai.\nChrome use karo.');
  recog.start(); listening = true;
  const btn = document.getElementById('mic-btn');
  btn.classList.add('on'); btn.textContent = '🔴';
}

function voiceOff() {
  recog?.stop(); listening = false;
  const btn = document.getElementById('mic-btn');
  btn.classList.remove('on'); btn.textContent = '🎤';
}

// ===== SETTINGS =====
function openSettings() { document.getElementById('settings-modal').classList.add('open'); }

function saveSettings() {
  cfg.name   = document.getElementById('s-name').value.trim() || 'Mera AI Agent';
  cfg.key    = document.getElementById('s-key').value.trim();
  cfg.prompt = document.getElementById('s-prompt').value.trim();
  localStorage.setItem('cfg_v1', JSON.stringify(cfg));

  document.getElementById('header-name').textContent = cfg.name;
  document.getElementById('welcome-title').textContent = `Namaste! Main ${cfg.name} hoon`;
  document.getElementById('avatar').textContent = cfg.name[0].toUpperCase();
  document.getElementById('settings-modal').classList.remove('open');
}

function clearChat() {
  if (!confirm('Puri chat delete kar dein?')) return;
  history = [];
  localStorage.removeItem('chat_v1');
  document.getElementById('chat').innerHTML = '';
  document.getElementById('welcome').style.display = 'flex';
  document.getElementById('chat').appendChild(document.getElementById('welcome'));
  document.getElementById('settings-modal').classList.remove('open');
}

function bgClose(e) {
  if (e.target.id === 'settings-modal')
    document.getElementById('settings-modal').classList.remove('open');
}

// ===== HELPERS =====
function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

function resize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}
</script>
</body>
</html>
